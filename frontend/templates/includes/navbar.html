{% load static %}
<header class="border-b border-[#1C2A38] sticky top-0 z-50 bg-[#05090D]/90 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
        <a href="{% url 'users:home' %}" class="flex items-center gap-2.5">
            <div class="w-7 h-7 rounded flex items-center justify-center font-bold text-sm bg-[#C09B2A] text-[#05090D] font-display">
                M
            </div>
            <span class="font-bold tracking-tight text-base font-display text-[#C8D4DF]">
                Monetra
            </span>
        </a>

        <!-- Desktop Links -->
        <nav class="hidden md:flex items-center gap-6 text-sm text-[#637585]">
            <a href="{% url 'users:home' %}#como-funciona" class="hover:text-[#C8D4DF] transition-colors">Como funciona</a>
            <a href="{% url 'users:home' %}#planos" class="hover:text-[#C8D4DF] transition-colors">Planos</a>
            <a href="{% url 'users:home' %}#faq" class="hover:text-[#C8D4DF] transition-colors">FAQ</a>
        </nav>

        <!-- Auth Actions -->
        <div class="flex items-center gap-3">
            {% if user.is_authenticated %}
                <a href="{% url 'users:dashboard' %}" class="text-sm font-semibold px-4 py-1.5 rounded transition-all bg-[#C09B2A] text-[#05090D] font-display hover:opacity-90">
                    Ir para o Dashboard →
                </a>
            {% else %}
                <a href="{% url 'users:login' %}" class="text-sm font-medium px-4 py-1.5 rounded text-[#637585] hover:text-[#C8D4DF] transition-colors">
                    Entrar
                </a>
                <a href="{% url 'users:signup' %}" class="text-sm font-semibold px-4 py-1.5 rounded transition-all bg-[#C09B2A] text-[#05090D] font-display hover:opacity-90 shadow-sm">
                    Começar grátis
                </a>
            {% endif %}
        </div>
    </div>
</header>
